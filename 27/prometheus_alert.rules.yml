groups:
  - name: custom_rules
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Target {{$labels.instance}} is down"
          description: "Target {{$labels.instance}} has been down for more than 1 minute."

      - alert: HighCpuLoad
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU load on {{$labels.instance}}"
          description: "CPU load is over 80% (current value: {{$value}}%)"

      - alert: LowDiskSpace
        expr: (node_filesystem_free_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on {{$labels.instance}}"
          description: "Free disk space on root volume is below 15% (current value: {{$value}}%)"
